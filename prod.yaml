apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: kknginx
    spec:
      containers:
        name: nginx
        image: nginx:1.14.5
        ports:
          containerPort: 80

